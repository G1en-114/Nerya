<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nerya</title>
<style>body{margin:0;background:#111512;color:#edf1e7;font-family:ui-sans-serif,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(520px,80vw)}small{color:#a9bb8f;letter-spacing:.2em}h1{font-size:56px;letter-spacing:-.05em;font-weight:500;margin:18px 0}p{color:#aeb8a8;line-height:1.8}progress{width:100%;height:3px;accent-color:#b4ce91}button{border:1px solid #667358;color:inherit;background:transparent;border-radius:8px;padding:10px 18px;cursor:pointer}#error{color:#ecb0a3;overflow-wrap:anywhere}footer{margin-top:40px;font-size:12px}</style>
<script defer src="boot.js"></script></head>
<body><main><small>YOUR LOCAL WORKSPACE</small><h1>Nerya</h1><p id="status" role="status">Starting your private workspace… / 正在启动本地工作空间…</p><progress aria-label="Starting"></progress><p id="error" role="alert"></p><button id="quit" hidden>Quit / 退出</button><footer><p>Configure a model, then start a conversation.<br>配置模型后即可开始对话。网络共享默认关闭。</p></footer></main></body></html>
